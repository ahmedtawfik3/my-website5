<html>
<head>

</head>
<body>
<h1>Welcome .. Please fill out your application</h1>
<hr>
<br>
<form>
<table>
<tr>
<td><label for="UserName">Name</label></td>
<td><input id="UserName" type="text" name="UserName"></td>
</tr>
<tr>
<td><label for="Email">Email address</label></td>
<td><input id="Email" type="email" name="Email"></td>
</tr>
<tr>
<td><label for="Number">Phone Number</label></td>
<td><input id="Number" type="number" name="PhoneNumber"></td>
</tr>
<tr>
<td><label for="id">Id Number</label></td>
<td><input id="id" type="number" name="IdNumber"></td>
</tr>
</table>
<table>
<h1>Select Your Gender</h1>
<tr>
<td><label for="Male">Male</label></td>
<td><input id="Male" type="radio" name="Gender" value="Male"></td>
</tr>
<td><label for="Female">Female</label></td>
<td><input id="Female" type="radio" name="Gender" value="Female"></td>
</tr>
</table>
<h1>Your Country</h1>
<select name="Country">
<option hidden disabled selected>Choose Your Country</option>
<option>Cairo</option>
<option>Giza</option>
<option>Alexandria</option>
<option>Beheira</option>
<option>Faiyum</option>
<option>Minya</option>
<option>Asyut</option>
<option>Sohag</option>
<option>Matrouh</option>
<option>Sinai</option>
<option>Dakahlia</option>
</select>
<br><br><br>
<button type="submit">Register</button>
<button type="reset"">Reset</button>

</form>
</body>
</html>
